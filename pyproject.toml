[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-crypto-sniper-mcp"
version = "5.0.0"
description = "AI Crypto Sniper MCP Server — control an autonomous Solana trading bot via 331 MCP tools across four modes: Meme sniping, Spot, Perpetuals, and Mirror copy-trading."
readme = "README_pypi.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "AI Crypto Sniper", email = "admin@solsniperbot.co"},
]
keywords = ["solana", "sniper", "mcp", "model-context-protocol", "trading", "bot", "pumpfun", "meme-coin", "perpetuals", "futures", "copy-trading", "mirror", "spot", "jupiter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.29.0,<2.0.0",
    "PyNaCl>=1.5.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    "aiohttp>=3.10.0,<4.0.0",
    "websockets>=12.0,<16.0",
    "pycryptodome>=3.20.0,<4.0.0",
    "solana>=0.36.0,<1.0.0",
    "solders>=0.26.0,<1.0.0",
]

[project.urls]
Homepage = "https://aicryptosniper.com/mcp/"
Repository = "https://github.com/solara-sniper-bot/AI-Crypto-Sniper-MCP"
Issues = "https://github.com/solara-sniper-bot/AI-Crypto-Sniper-MCP/issues"

[project.scripts]
ai-crypto-sniper-mcp = "ai_crypto_sniper_mcp.server:main"

[tool.setuptools.packages.find]
include = ["ai_crypto_sniper_mcp*"]
